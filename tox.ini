[tox]
envlist = py310
skipsdist = True
# Must not require tox 4: tox 3 would then provision tox 4 into envdir
# (see below), which then tries to recreate its own running venv.
minversion = 3.28

[testenv]
description = Run invoke
# Must differ from uv's own project venv (.venv): commands run `uv run inv`,
# and if tox's bootstrap venv used the same .venv dir, uv would try to
# delete/recreate it while its own uv.exe is still running from inside it -
# which fails on Windows (file in use).
envdir = .tox-venv
skip_install = true
deps =
    invoke==2.0.0
    uv
commands =
    uv run --all-extras inv {posargs}
