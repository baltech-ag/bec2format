[project]
name = "bec2format"
version = "1.05.00"
description = "BALTECH BEC2 file format"
authors = [{ name = "Baltech AG", email = "info@baltech.de" }]
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10,<4.0"
dependencies = []

[project.optional-dependencies]
aes = ["cryptography"]

[project.scripts]
bec2format = "bec2format.cli:main"

[dependency-groups]
dev = [
    "uv",
    "invoke>=2,<3",
    "pytest",
    "mypy",
    "ruff",
    "types-invoke",
]

[tool.mypy]
exclude = [
  "appnotes/register_crypto_plugin/ecdsa/*",
  "appnotes/register_crypto_plugin/pyaes/*",
]

[[tool.mypy.overrides]]
# MicroPython's package manager, only available on MicroPython
module = ["mip"]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = [
  "appnotes/register_crypto_plugin/ecdsa",
  "appnotes/register_crypto_plugin/pyaes",
]

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # isort
  "S",            # flake8-bandit
  "T10",          # flake8-breakpoint
  "B",            # flake8-bugbear
  "A",            # flake8-builtins
  "C4",           # flake8-comprehensions
  "ERA",          # flake8-eradicate
  "G",            # flake8-logging-format
  "T20",          # flake8-print
  "PT",           # flake8-pytest-style
  "RET",          # flake8-return
  "N",            # pep8-naming
  "SIM",          # flake8-simplify
]
ignore = [
  # line too long handled by the formatter
  "E501",
  # raise ... from err: MicroPython prints "exception chaining not supported"
  "B904",
]

[tool.ruff.lint.per-file-ignores]
# asserts are the very purpose of a test
"tests/*" = ["S101"]
# re-exports (the public API of the package) and imports for side effects
"bec2format/__init__.py" = ["F401"]
# example scripts check and print their results
"appnotes/*.py" = ["S101", "T201"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# flat layout: the package lives in ./bec2format, not in ./src/bec2format
module-root = ""

