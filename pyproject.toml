[project]
name = "bec2format"
version = "1.04.00"
description = "BALTECH BEC2 file format"
authors = [{ name = "Baltech AG", email = "info@baltech.de" }]
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10,<4.0"
dependencies = []

[project.optional-dependencies]
aes = ["cryptography"]

[project.scripts]
bec2format = "bec2format.cli:main"

[dependency-groups]
dev = [
    "uv",
    "invoke>=2,<3",
    "pytest",
    "mypy",
    "black",
    "isort",
    "flake8",
    "flake8-awesome",
    "flake8-simplify",
    "Flake8-pyproject",
    "types-invoke",
]

[tool.mypy]
exclude = [
  "appnotes/register_crypto_plugin/ecdsa/*",
  "appnotes/register_crypto_plugin/pyaes/*",
]

[tool.isort]
profile = "black"
extend_skip = [".tox-venv"]
extend_skip_glob = [
  "/appnotes/register_crypto_plugin/ecdsa/*",
  "/appnotes/register_crypto_plugin/pyaes/*",
]

[tool.black]
skip-magic-trailing-comma = true
extend-exclude = "/appnotes/register_crypto_plugin/(ecdsa|pyaes)/"

[tool.flake8]
exclude = [
  ".git",
  ".github",
  ".mypy_cache",
  ".tox",
  ".tox-venv",
  ".venv",
  "__pycache__",
  "appnotes/register_crypto_plugin/ecdsa",
  "appnotes/register_crypto_plugin/pyaes",
]
ignore = [
  # line too long handled by black
  "E501",
  # invoke not listed in dependencies
  "I900",
  # don`t use "[on_true] if [expression] else [on_false]" syntax
  "IF100",
  # line break before binary operator: collides with black
  "W503",
  # whitespace before ':'
  "E203",
]
per-file-ignores = [
  # asserts are the very purpose of a test
  "tests/*:S101",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# flat layout: the package lives in ./bec2format, not in ./src/bec2format
module-root = ""

